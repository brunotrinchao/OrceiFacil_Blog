name: Generate Daily Posts

on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC = 08:17 BRT
  workflow_dispatch: {}

permissions:
  contents: write            # Permissão para o bot commitar no repositório

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Today's Posts
        run: node scripts/generate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NUXT_PUBLIC_SITE_URL: 'https://blog.orceifacil.com.br'
          MODEL: 'gemini-2.5-flash'
          TIMEZONE: 'America/Sao_Paulo'
          POSTS_PER_DAY: '5'
          NUXT_CLOUDINARY_CLOUD_NAME: ${{ secrets.NUXT_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}

      - name: Commit and Push (Bot)
        run: |
          git config user.name 'orcablog[bot]'
          git config user.email 'orcablog[bot]@users.noreply.github.com'
          git add content/posts
          git diff --cached --quiet && echo "Nenhuma alteração de post hoje." && exit 0
          git commit -m "chore(blog): auto-generate daily posts for $(date -u +%Y-%m-%d)"
          git push

      - name: Build (Nitro → Vercel)
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: 'https://blog.orceifacil.com.br'

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: 'team_bI3KCtspU2U4gxS3Eqc7QUZU'
          VERCEL_PROJECT_ID: 'prj_N6GNgitsBTbsiFalT0TeFV53Uvtk'
        run: npx vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN

      - name: Ping IndexNow (Bing, Opcional)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then
            curl -fsS "https://api.indexnow.org/indexnow?url=https://blog.orceifacil.com.br/sitemap.xml&key=${INDEXNOW_KEY}" || true
          else
            echo "INDEXNOW_KEY não configurada — pulando ping."
          fi
